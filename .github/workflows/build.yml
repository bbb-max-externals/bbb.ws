name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci --prefix tests

      - name: Configure and Build
        run: cmake -B build -DUSE_TLS=1 -DCMAKE_BUILD_TYPE=Release -DBBB_WS_BUILD_TESTS=ON && cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: externals/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci --prefix tests

      - name: Install mbedTLS via vcpkg
        run: vcpkg install mbedtls:x64-windows-static

      - name: Configure and Build
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DUSE_TLS=1 -DUSE_MBED_TLS=1 -DBBB_WS_BUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static && cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: externals/

  package:
    permissions:
      contents: write
    needs: [build-macos, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS externals
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos
          path: dist/${{ github.event.repository.name }}/externals/

      - name: Download Windows externals
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: dist/${{ github.event.repository.name }}/externals/

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/${{ github.event.repository.name }}"
          mkdir -p "$PKG"
          for file in package-info.json README.md LICENSE; do
            if [ -f "$file" ]; then
              cp "$file" "$PKG/"
            fi
          done
          for dir in help extra extras patchers patches docs schemas examples media; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "$PKG/"
            fi
          done
          if [ -d "$PKG/externals" ]; then
            find "$PKG/externals" -path '*/Contents/MacOS/*' -type f -exec chmod 755 {} +
          fi

      - name: Create macOS-preserving archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent "${{ github.event.repository.name }}" "${{ github.event.repository.name }}.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-latest
          path: dist/${{ github.event.repository.name }}.zip

      - name: Update latest package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="dist/${{ github.event.repository.name }}.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest package" --notes "Automatically updated from main at ${GITHUB_SHA}."
            gh release upload latest "$ZIP" --clobber
          else
            gh release create latest "$ZIP" --title "Latest package" --notes "Automatically updated from main at ${GITHUB_SHA}." --latest
          fi

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ github.event.repository.name }}.zip
